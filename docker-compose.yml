x-django-config: &django-app
  image: local/manhwa_web:dev
  build: 
    context: ./backend
    dockerfile: Dockerfile
  env_file:
    - ./.env
  volumes:
    - ./backend:/code
  depends_on:
    redis:
      condition: service_healthy
    db:
      condition: service_healthy

services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./backend/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/code/staticfiles
      - media_volume:/code/media
      - protected_media:/code/protected
    depends_on:
      - web
      - frontend
    restart: always

  db:
    image: postgres:14-alpine
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  web:
    <<: *django-app
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    # command: python manage.py runserver 0.0.0.0:8000
    expose:
      - "8000"
    volumes:
      - ./backend:/code
      - ./backend/db_images:/code/db_images
      - static_volume:/code/staticfiles
      - media_volume:/code/media
      - protected_media:/code/protected
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/healthy/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  celery_worker:
    <<: *django-app
    command: celery -A config worker --loglevel=info
    volumes:
      - ./backend:/code
      - media_volume:/code/media
      - protected_media:/code/protected

  celery_beat:
    <<: *django-app
    command: celery -A config beat --loglevel=info

  frontend:
    build:
      context: ./frontend 
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost
        NEXT_PUBLIC_MEDIA_BASE_URL: http://localhost
    environment:
      INTERNAL_API_BASE_URL: http://web:8000
      NEXT_PUBLIC_API_BASE_URL: http://localhost
      NEXT_PUBLIC_MEDIA_BASE_URL: http://localhost
    expose:
      - "3000"
    depends_on:
      - web
    restart: unless-stopped


volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  protected_media:
